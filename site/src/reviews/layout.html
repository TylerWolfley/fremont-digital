<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Fremont Digital — Service hub review</title>
  <link rel="icon" href="/assets/favicons/favicon.ico">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#d9e3e3;color:#0b202b;font:13px/1.5 system-ui,sans-serif;overflow:hidden}
    .review-bar{height:72px;padding:12px 25px;display:flex;align-items:center;justify-content:space-between;gap:24px;background:#0b202b;color:#fff}
    .review-title{display:flex;align-items:center;gap:18px}.review-title small{color:#a8c9ff;font-size:10px;letter-spacing:.1em}.review-title strong{font-weight:500}.review-title span{display:block;color:#bdc6c8;font-size:10px}
    .controls{display:flex;align-items:center;gap:10px}.controls label{font-size:11px;color:#bdc6c8}
    select{font:inherit;font-size:11px;border:1px solid #6e7a7e;color:white;background:#0b202b;padding:8px;border-radius:2px}
    select:focus-visible{outline:2px solid #a8c9ff;outline-offset:3px}
    .stage{height:calc(100dvh - 72px);overflow:auto;padding:0 20px}.device{width:100%;max-width:1600px;height:100%;margin:auto;background:white;box-shadow:0 0 0 1px #ccd1cb}
    iframe{width:100%;height:100%;display:block;border:0;background:#f8fbfa}
    @media(max-width:600px){.review-bar{height:102px;align-items:flex-start;justify-content:center;flex-direction:column;gap:9px;padding:10px 16px}.review-title span{display:inline;margin-left:8px}.stage{height:calc(100dvh - 102px);padding:0}.review-title{gap:12px}.controls label{font-size:10px}}
  </style>
</head>
<body>
  <div class="review-bar">
    <div class="review-title"><small>03 / SITE</small><div><strong>Fremont Digital</strong><span>Service hub review</span></div></div>
    <div class="controls"><label for="viewport">Preview width</label><select id="viewport"><option value="auto">Fit to window</option><option value="1440">Desktop · 1440px</option><option value="1200">Small desktop · 1200px</option><option value="1024">Tablet landscape · 1024px</option><option value="768">Tablet · 768px</option><option value="390">Phone · 390px</option><option value="320">Small phone · 320px</option></select></div>
  </div>
  <div class="stage"><div class="device" id="device"><iframe id="preview" data-preview-content title="Fremont Digital full page layout"></iframe></div></div>
  <script>
    document.getElementById('viewport').addEventListener('change', event => {
      const width = event.target.value;
      document.getElementById('device').style.width = width === 'auto' ? '100%' : width + 'px';
    });
  </script>
</body>
</html>
