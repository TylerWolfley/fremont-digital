:root{
  --color-ink:#202b34;
  --color-muted:#58676d;
  --color-copper:#9d5d36;
  --color-copper-light:#b77848;
  --color-paper:#f5f3ed;
  --color-white:#fff;
  --color-line:#e3e5df;
  --font-body:Manrope,Arial,sans-serif;
  --max-width:1360px;
  --gutter:clamp(20px,4.4vw,72px);
}
*{box-sizing:border-box}
html{color:var(--color-ink);background:var(--color-paper);font-family:var(--font-body);-webkit-text-size-adjust:100%}
body{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit}
button,a,summary{-webkit-tap-highlight-color:transparent}
svg{display:block;flex-shrink:0}
img{display:block;max-width:100%;height:auto}
:focus-visible{outline:3px solid var(--color-copper);outline-offset:5px;border-radius:2px}
.skip-link{position:fixed;top:10px;left:16px;z-index:100;background:var(--color-white);padding:12px 18px;transform:translateY(-160%)}
.skip-link:focus{transform:translateY(0)}
.page-main{min-height:calc(100svh - 150px)}
.page-main:focus{outline:none}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--color-copper)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
&lt;/style&gt;
  &lt;style&gt;.site-header{position:sticky;top:0;z-index:20;background:var(--color-white)}
.header-container{width:100%;max-width:calc(var(--max-width) + var(--gutter)*2);padding-inline:var(--gutter);margin-inline:auto}
.utility-bar{background:var(--color-paper);border-bottom:1px solid var(--color-line)}
.utility-bar__inner{height:38px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:11px;letter-spacing:.02em;color:var(--color-muted)}
.utility-bar__inner&gt;span{display:flex;align-items:center;gap:7px}
.utility-bar svg{width:15px;height:15px;color:var(--color-copper)}
.utility-bar a{text-decoration:none;padding-block:9px;transition:color .16s}
.utility-bar a:hover{color:var(--color-copper)}
.header-main{position:relative;border-bottom:1px solid var(--color-line)}
.header-main__inner{min-height:110px;display:flex;align-items:center;justify-content:space-between;gap:30px}
.brand{display:block;width:220px;flex-shrink:0}
.brand img{width:100%}
.desktop-nav{display:flex;align-items:center;gap:clamp(12px,2.1vw,34px);margin-left:auto}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.desktop-nav summary{display:flex;align-items:center;gap:8px;position:relative;min-height:54px;font-size:14px;font-weight:600;white-space:nowrap}
.desktop-nav summary::after{position:absolute;content:'';height:2px;background:var(--color-copper-light);left:0;right:24px;bottom:3px;transform:scaleX(0);transform-origin:left;transition:transform .18s ease}
.desktop-nav summary:hover::after,.desktop-nav details[open]&gt;summary::after{transform:scaleX(1)}
.service-disclosure&gt;summary&gt;svg{width:16px;height:16px;color:var(--color-muted);transition:transform .18s}
.service-disclosure[open]&gt;summary&gt;svg{transform:rotate(180deg)}
.contact-button{display:inline-flex;align-items:center;justify-content:space-between;gap:25px;min-height:48px;background:var(--color-ink);color:white;border:1px solid var(--color-ink);padding:12px 20px;font-size:13px;font-weight:600;text-decoration:none;transition:background .18s,border-color .18s}
.contact-button&gt;svg{width:21px;height:21px;transition:transform .18s}
.contact-button:hover{background:var(--color-copper);border-color:var(--color-copper)}
.contact-button:hover&gt;svg{transform:translateX(3px)}
.desktop-contact{flex-shrink:0;margin-left:6px}
.service-panel{background:white}
.desktop-nav .service-panel{position:absolute;left:0;right:0;top:100%;max-height:calc(100dvh - 150px);overflow-y:auto;overscroll-behavior:contain;border-bottom:1px solid var(--color-line);box-shadow:0 22px 25px -25px #202b3460}
.service-panel__inner{max-width:calc(var(--max-width) + var(--gutter)*2);padding:40px var(--gutter) 0;margin-inline:auto;display:grid;grid-template-columns:minmax(220px,.82fr) minmax(400px,1.7fr);column-gap:clamp(30px,5vw,90px)}
.service-panel__intro .eyebrow{margin:0 0 17px}
.service-panel__intro h2{max-width:360px;margin:0;font-size:clamp(25px,2.4vw,36px);font-weight:600;letter-spacing:-.045em;line-height:1.16}
.service-panel__description{max-width:355px;margin:17px 0 22px;font-size:14px;line-height:1.8;color:var(--color-muted)}
.service-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:30px;list-style:none;padding:0;margin:0;align-content:start}
.service-list li{border-top:1px solid var(--color-line)}
.service-list a{height:100%;min-height:112px;display:flex;align-items:flex-start;justify-content:space-between;gap:15px;text-decoration:none;padding:21px 0;transition:color .15s}
.service-list a&gt;span{display:block}
.service-list strong{display:block;font-size:15px;line-height:1.4;font-weight:600;letter-spacing:-.02em}
.service-list a&gt;span&gt;span{display:block;margin-top:7px;max-width:260px;font-size:13px;line-height:1.7;color:var(--color-muted)}
.service-list svg{width:20px;height:20px;margin-top:1px;color:var(--color-copper);transition:transform .15s}
.service-list a:hover{color:var(--color-copper)}
.service-list a:hover&gt;svg{transform:translateX(3px)}
.service-panel__footer{grid-column:1/-1;border-top:1px solid var(--color-line);margin-top:22px;padding:20px 0;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:12px;color:var(--color-muted)}
.service-panel__footer p{margin:0}
.service-panel__footer a{color:var(--color-ink);text-underline-offset:4px;margin-left:4px}
.service-panel__footer&gt;span{font-size:11px}
.mobile-menu{display:none}
@media(min-width:1440px){.header-main__inner{gap:44px}.desktop-nav{gap:36px}.desktop-nav summary{font-size:15px}}
@media(max-width:1199px){
  .desktop-nav,.desktop-contact{display:none}
  .header-main__inner{min-height:96px}
  .brand{width:210px}
  .mobile-menu{display:block}
  .mobile-menu&gt;summary{display:flex;align-items:center;gap:12px;min-height:48px;min-width:74px;font-size:13px;font-weight:600}
  .menu-icon{width:22px;height:18px;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .menu-icon i{display:block;width:22px;height:1.5px;background:var(--color-ink);transition:transform .18s}
  .mobile-menu[open]&gt;.mobile-menu__panel{display:block}
  .mobile-menu[open]&gt;summary .menu-icon i:first-child{transform:translateY(3.75px) rotate(45deg)}
  .mobile-menu[open]&gt;summary .menu-icon i:last-child{transform:translateY(-3.75px) rotate(-45deg)}
  .mobile-menu__panel{position:absolute;inset:100% 0 auto;background:white;max-height:calc(100dvh - 135px);overflow-y:auto;overscroll-behavior:contain;border-bottom:1px solid var(--color-line);box-shadow:0 18px 25px -25px #202b3480;padding:8px var(--gutter) 28px}
  .mobile-menu nav{display:block}
  .mobile-menu .service-disclosure{border-bottom:1px solid var(--color-line)}
  .mobile-menu .service-disclosure&gt;summary{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:64px;font-size:19px;font-weight:600;letter-spacing:-.025em}
  .mobile-menu .service-panel__inner{display:block;padding:8px 0 0}
  .mobile-menu .service-panel__intro .eyebrow,.mobile-menu .service-panel__intro h2{display:none}
  .mobile-menu .service-panel__description{max-width:540px;margin:0 0 24px;font-size:14px;line-height:1.7}
  .mobile-menu .service-list{column-gap:32px}
  .mobile-menu .service-list a{min-height:100px;padding:19px 0}
  .mobile-menu .service-panel__footer{margin-top:4px;padding:18px 0;align-items:flex-start;flex-direction:column;gap:11px}
  .mobile-contact{padding-top:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .mobile-email{font-size:13px;color:var(--color-muted);text-decoration:none;padding:8px 0}
}
@media(max-width:540px){
  .utility-bar__inner{height:32px;font-size:10px}
  .utility-bar__inner&gt;a{display:none}
  .header-main__inner{min-height:87px;gap:18px}
  .brand{width:190px}
  .mobile-menu&gt;summary{min-width:64px;gap:9px}
  .menu-label{font-size:12px}
  .mobile-menu__panel{max-height:calc(100dvh - 120px)}
  .mobile-menu .service-list{grid-template-columns:1fr}
  .mobile-menu .service-list a{min-height:90px}
  .mobile-menu .service-list a&gt;span&gt;span{max-width:none;font-size:13px}
  .mobile-menu .service-disclosure&gt;summary{font-size:18px}
  .mobile-contact{display:block}
  .mobile-contact .contact-button{display:flex;width:100%;min-height:52px}
  .mobile-email{display:block;text-align:center;margin-top:12px;overflow-wrap:anywhere}
}
@media(max-width:359px){.brand{width:166px}.header-main__inner{gap:16px}.menu-label{display:none}.mobile-menu&gt;summary{min-width:44px;justify-content:flex-end}}

/* Shared page rhythm */
html { scroll-behavior: smooth; scroll-padding-top: 174px; }
.section-container { width: 100%; max-width: calc(var(--max-width) + var(--gutter)*2); padding-inline: var(--gutter); margin-inline: auto; }
.section-space { padding-block: clamp(72px, 7.8vw, 120px); }
h1, h2, h3, p { margin-top: 0; }
h1, h2, h3 { text-wrap: balance; }
h2 { margin-bottom: 0; font-size: clamp(34px, 3.6vw, 54px); font-weight: 600; letter-spacing: -.055em; line-height: 1.15; }
h1 em, h2 em { display: block; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -.025em; line-height: 1.04; }
.section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: 52px; }
.section-heading .eyebrow { margin-bottom: 19px; }
.section-heading &gt; p { color: var(--color-muted); font-size: 14px; margin-bottom: 5px; }
.button { display: inline-flex; align-items: center; justify-content: space-between; gap: 28px; min-height: 54px; padding: 16px 22px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background .2s, color .2s; }
.button svg, .text-link svg { width: 21px; height: 21px; }
.button--dark { background: var(--color-ink); color: white; }
.button--dark:hover { background: var(--color-copper); }
.text-link { display: inline-flex; align-items: center; gap: 14px; padding-block: 12px; font-size: 13px; font-weight: 600; text-decoration: none; }
.text-link svg { transition: transform .2s; }
.text-link:hover svg { transform: translateX(4px); }
.text-link:hover { text-decoration: underline; text-underline-offset: 5px; }
.index-number { color: var(--color-copper); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .05em; }

/* 01 — Opening */
.hero { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, .82fr); gap: clamp(36px, 5.5vw, 84px); align-items: center; padding-block: 74px 88px; }
.hero__copy { padding-block: 20px; }
.hero__copy &gt; .eyebrow { margin-bottom: 30px; }
.hero h1 { margin-bottom: 28px; font-size: clamp(62px, 6.6vw, 100px); line-height: 1.04; font-weight: 600; letter-spacing: -.065em; }
.hero h1 em { margin-top: 4px; font-size: 1.12em; color: var(--color-copper); }
.hero__description { max-width: 375px; color: var(--color-muted); font-size: 16px; line-height: 1.8; margin-bottom: 29px; }
.hero__actions { display: flex; align-items: center; gap: 27px; flex-wrap: wrap; }
.hero__note { display: flex; align-items: center; gap: 10px; margin: 37px 0 0; font-size: 11px; color: var(--color-muted); }
.hero__note &gt; span { width: 18px; height: 1px; background: var(--color-copper); }
.brand-board { background: white; border: 1px solid #d9dcd5; position: relative; }
.brand-board::after { content: ''; position: absolute; pointer-events: none; top: 14px; left: 14px; right: -14px; bottom: -14px; border: 1px solid #d9dcd5; z-index: -1; }
.brand-board__top { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 18px 24px; border-bottom: 1px solid var(--color-line); font-size: 10px; letter-spacing: .04em; }
.brand-board__top &gt; span:last-child { color: var(--color-muted); }
.brand-board__mark { padding: clamp(30px, 4vw, 62px) clamp(40px, 5vw, 78px); }
.brand-board__mark img { width: 100%; }
.brand-board__index { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--color-line); }
.brand-board__index a { display: grid; grid-template-columns: 20px 1fr 16px; align-items: center; gap: 10px; min-height: 66px; padding: 13px 20px; font-size: 11px; font-weight: 600; text-decoration: none; transition: background .2s; }
.brand-board__index a:nth-child(odd) { border-right: 1px solid var(--color-line); }
.brand-board__index a:nth-child(-n+2) { border-bottom: 1px solid var(--color-line); }
.brand-board__index svg { width: 16px; height: 16px; }
.brand-board__index a:hover { background: var(--color-paper); }

/* 02 — Service directory */
.services-section { background: white; border-top: 1px solid var(--color-line); }
.service-directory { border-top: 1px solid #cdd2cc; }
.service-category { border-bottom: 1px solid #cdd2cc; }
.service-category &gt; summary { display: grid; grid-template-columns: 28px 44px 1fr auto 44px; gap: 24px; align-items: center; min-height: 106px; padding: 22px 0; }
.category-icon { color: var(--color-muted); }
.category-icon svg { width: 34px; height: 34px; }
.service-category h3 { margin: 0; font-size: clamp(24px, 2.3vw, 34px); font-weight: 600; line-height: 1.2; letter-spacing: -.04em; }
.category-hint { font-size: 12px; color: var(--color-muted); }
.category-toggle { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--color-line); border-radius: 50%; transition: background .2s, transform .2s; }
.category-toggle svg { width: 20px; height: 20px; }
.service-category[open] .category-toggle { background: var(--color-paper); transform: rotate(45deg); }
.service-category &gt; summary:hover h3 { color: var(--color-copper); }
.service-category__body { display: grid; grid-template-columns: minmax(220px, .85fr) minmax(0, 1.5fr); gap: clamp(36px, 6vw, 90px); padding: 2px 0 36px 52px; }
.service-category__intro &gt; p { max-width: 340px; margin-bottom: 20px; font-size: 14px; color: var(--color-muted); line-height: 1.9; }
.service-category__intro &gt; span { display: block; max-width: 250px; font-size: 10px; line-height: 1.8; color: var(--color-muted); }
.directory-links { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; margin: 0; padding: 0; align-content: start; }
.directory-links li { border-top: 1px solid var(--color-line); }
.directory-links a { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 100%; min-height: 63px; padding: 15px 0; font-size: 12px; line-height: 1.6; text-decoration: none; }
.directory-links svg { width: 17px; height: 17px; color: var(--color-copper); }
.directory-links a:hover { color: var(--color-copper); text-decoration: underline; text-underline-offset: 4px; }
.services-footnote { margin: 30px 0 0; font-size: 12px; color: var(--color-muted); line-height: 1.9; }
.services-footnote a { color: var(--color-ink); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; margin-left: 5px; }
.services-footnote a:hover { text-decoration: underline; text-underline-offset: 4px; }
.services-footnote svg { width: 16px; height: 16px; }

/* 03 — Connected business services */
.business-section { background: var(--color-ink); color: var(--color-paper); }
.business-layout { display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: clamp(60px, 10vw, 150px); }
.business-copy &gt; .eyebrow { color: #e1ad87; margin-bottom: 27px; }
.business-copy h2 { font-size: clamp(38px, 4vw, 60px); }
.business-copy h2 em { margin-top: 7px; font-size: 1.14em; color: #e1ad87; }
.business-copy &gt; p:not(.eyebrow) { color: #bdc6c8; max-width: 355px; font-size: 14px; line-height: 1.9; margin-top: 26px; margin-bottom: 16px; }
.business-copy .text-link { color: white; }
.connection-list { display: grid; gap: 24px; }
.connection { position: relative; display: grid; grid-template-columns: 54px 1fr 20px; align-items: center; gap: 22px; border: 1px solid #526067; background: #25313a; padding: 23px; text-decoration: none; transition: border-color .2s, background .2s; }
.connection:not(:last-child)::after { position: absolute; content: ''; width: 1px; height: 25px; top: 100%; left: 50px; background: #9e795e; }
.connection__icon { display: grid; place-items: center; width: 54px; height: 54px; border: 1px solid #647077; color: #e1ad87; }
.connection__icon svg { width: 31px; height: 31px; }
.connection small { display: block; color: #bdc6c8; font-size: 10px; margin-bottom: 7px; }
.connection strong { display: block; font-size: 17px; line-height: 1.4; font-weight: 600; letter-spacing: -.025em; }
.connection &gt; svg { width: 19px; height: 19px; color: #e1ad87; }
.connection:hover { border-color: #e1ad87; background: #2b3942; }

/* 04 — Process */
.process-section { background: #fff; }
.process-steps { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px; margin: 0; padding: 0; }
.process-steps li { border-top: 1px solid #cdd2cc; padding-top: 23px; }
.step-number { display: block; font-size: 12px; color: var(--color-copper); margin-bottom: 40px; }
.process-steps h3 { font-size: 20px; font-weight: 600; letter-spacing: -.035em; margin-bottom: 12px; line-height: 1.5; }
.process-steps p { font-size: 13px; color: var(--color-muted); line-height: 1.8; margin: 0; }

/* 05 — Contact */
.contact-section { border-top: 1px solid var(--color-line); }
.contact-layout { display: grid; grid-template-columns: 1.2fr .8fr; gap: 80px; align-items: center; }
.contact-location { display: flex; align-items: center; gap: 8px; margin-bottom: 26px; font-size: 10px; letter-spacing: .09em; }
.contact-location svg { width: 17px; height: 17px; }
.contact-section h2 { font-size: clamp(52px, 5.8vw, 86px); }
.contact-section h2 em { color: var(--color-copper); font-size: 1.12em; margin-top: 3px; }
.contact-details { padding-top: 25px; }
.contact-details &gt; p { color: var(--color-muted); font-size: 15px; line-height: 1.8; margin-bottom: 24px; }
.contact-details .button { min-width: 245px; }
.contact-address { display: block; width: fit-content; margin-top: 28px; color: var(--color-ink); font-size: clamp(14px, 1.45vw, 20px); text-decoration-thickness: 1px; text-underline-offset: 6px; overflow-wrap: anywhere; }
.contact-details small { display: block; margin-top: 13px; font-size: 10px; color: var(--color-muted); }

/* 06 — Footer */
.site-footer { background: white; border-top: 1px solid var(--color-line); }
.footer-main { display: flex; align-items: center; justify-content: space-between; gap: 28px; padding-block: 18px; }
.footer-brand { display: block; width: 165px; flex-shrink: 0; }
.footer-main nav { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.footer-main nav a { padding-block: 10px; color: var(--color-muted); font-size: 12px; text-decoration: none; }
.footer-main nav a:hover { color: var(--color-copper); }
.footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 8px; border-top: 1px solid var(--color-line); font-size: 10px; color: var(--color-muted); }
.footer-bottom a { display: inline-flex; align-items: center; gap: 12px; padding-block: 4px; text-decoration: none; }
.footer-bottom svg { width: 15px; height: 15px; transform: rotate(-90deg); }

@media (max-width: 1199px) {
  html { scroll-padding-top: 160px; }
  .brand-board__index a { gap: 6px; padding: 14px 12px; font-size: 10px; }
  .category-hint { font-size: 10px; }
  .service-category &gt; summary { gap: 18px; }
  .business-layout { gap: 60px; }
}
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr 1fr; gap: 35px; padding-block: 60px 70px; }
  .hero h1 { font-size: clamp(48px, 6.5vw, 62px); }
  .hero__copy &gt; .eyebrow { font-size: 9px; letter-spacing: .08em; }
  .hero__description { font-size: 14px; }
  .hero__actions { gap: 16px; }
  .hero__actions .button { padding-inline: 16px; gap: 16px; font-size: 11px; }
  .hero__actions .text-link { font-size: 11px; }
  .hero__note { font-size: 10px; line-height: 1.7; }
  .brand-board__top { padding-inline: 17px; font-size: 9px; }
  .brand-board__mark { padding: 38px; }
  .brand-board__index { grid-template-columns: 1fr; }
  .brand-board__index a { min-height: 43px; padding-inline: 17px; }
  .brand-board__index a:nth-child(odd) { border-right: 0; }
  .brand-board__index a:not(:last-child) { border-bottom: 1px solid var(--color-line); }
  .category-hint { display: none; }
  .service-category &gt; summary { grid-template-columns: 24px 40px 1fr 42px; }
  .service-category__body { grid-template-columns: 1fr; gap: 20px; padding-left: 42px; }
  .service-category__intro { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; }
  .service-category__intro &gt; p { margin-bottom: 0; }
  .service-category__intro &gt; span { max-width: 180px; }
  .business-layout { grid-template-columns: 1fr 1fr; gap: 40px; }
  .business-copy h2 { font-size: 38px; }
  .connection { grid-template-columns: 42px 1fr 16px; gap: 15px; padding: 18px; }
  .connection__icon { width: 42px; height: 42px; }
  .connection:not(:last-child)::after { left: 39px; }
  .connection strong { font-size: 14px; }
  .process-steps { gap: 26px; }
  .process-steps h3 { font-size: 18px; }
  .contact-layout { gap: 40px; }
  .footer-main { align-items: flex-start; gap: 30px; }
  .footer-main nav { gap: 6px 22px; max-width: 320px; }
}
@media (max-width: 760px) {
  .section-space { padding-block: 65px; }
  .section-heading { display: block; margin-bottom: 32px; }
  .section-heading &gt; p { margin-top: 17px; }
  .hero { grid-template-columns: 1fr; gap: 40px; padding-block: 40px 60px; }
  .hero__copy { padding-block: 0; }
  .hero__copy &gt; .eyebrow { margin-bottom: 24px; font-size: 10px; }
  .hero h1 { font-size: clamp(42px, 13vw, 76px); margin-bottom: 24px; }
  .hero__description { max-width: 330px; font-size: 15px; margin-bottom: 25px; }
  .hero__actions { gap: 20px; }
  .hero__actions .button { font-size: 12px; min-height: 52px; padding-inline: 19px; }
  .hero__actions .text-link { font-size: 12px; }
  .hero__note { margin-top: 25px; font-size: 10px; }
  .brand-board { max-width: 470px; width: 100%; justify-self: center; }
  .brand-board::after { display: none; }
  .brand-board__top { padding: 15px 18px; font-size: 9px; }
  .brand-board__mark { padding: 31px 65px; }
  .brand-board__mark img { max-width: 230px; margin: auto; }
  .brand-board__index { grid-template-columns: 1fr 1fr; }
  .brand-board__index a { min-height: 57px; padding-inline: 14px; font-size: 10px; }
  .brand-board__index a:nth-child(odd) { border-right: 1px solid var(--color-line); }
  .brand-board__index a:nth-child(3) { border-bottom: 0; }
  .service-category &gt; summary { grid-template-columns: 18px 1fr 34px; gap: 14px; min-height: 91px; padding-block: 21px; }
  .category-icon { display: none; }
  .service-category h3 { font-size: 25px; }
  .category-toggle { width: 33px; height: 33px; }
  .service-category__body { padding: 0 0 28px; gap: 22px; }
  .service-category__intro { display: block; }
  .service-category__intro &gt; p { max-width: none; font-size: 13px; }
  .service-category__intro &gt; span { max-width: none; margin-top: 12px; }
  .directory-links { column-gap: 22px; }
  .directory-links a { font-size: 11px; gap: 10px; }
  .services-footnote { font-size: 11px; }
  .services-footnote a { margin-left: 0; }
  .business-layout { grid-template-columns: 1fr; gap: 38px; }
  .business-copy h2 { font-size: 43px; }
  .business-copy &gt; p:not(.eyebrow) { max-width: 340px; }
  .connection-list { gap: 19px; }
  .connection { padding: 20px; grid-template-columns: 46px 1fr 18px; gap: 20px; }
  .connection__icon { width: 46px; height: 46px; }
  .connection:not(:last-child)::after { left: 43px; height: 20px; }
  .connection strong { font-size: 16px; }
  .process-steps { grid-template-columns: 1fr; gap: 26px; }
  .process-steps li { display: grid; grid-template-columns: 32px 1fr; column-gap: 17px; padding-top: 24px; }
  .step-number { margin: 5px 0 0; grid-row: 1 / 3; }
  .process-steps h3 { font-size: 19px; margin-bottom: 8px; }
  .process-steps p { grid-column: 2; font-size: 12px; }
  .contact-layout { grid-template-columns: 1fr; gap: 25px; }
  .contact-location { font-size: 9px; letter-spacing: .05em; }
  .contact-section h2 { font-size: clamp(54px, 11vw, 72px); }
  .contact-details { padding-top: 0; }
  .contact-address { font-size: 17px; }
  .footer-main { display: block; padding-block: 18px 12px; }
  .footer-brand { width: 150px; }
  .footer-main nav { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; max-width: none; gap: 0 24px; }
  .footer-main nav a { display: flex; align-items: center; min-height: 32px; padding-block: 6px; font-size: 11px; }
  .footer-bottom { display: grid; grid-template-columns: 1fr auto; gap: 5px 16px; padding-block: 12px; font-size: 10px; }
  .footer-bottom &gt; span:nth-child(2) { grid-column: 1; grid-row: 2; }
  .footer-bottom &gt; a { grid-column: 2; grid-row: 1 / 3; min-height: 32px; }
}
@media (max-width: 540px) { html { scroll-padding-top: 143px; } }
@media (max-width: 359px) {
  .hero h1 { font-size: 42px; }
  .hero__actions { gap: 15px; }
  .hero__actions .button { padding-inline: 13px; gap: 12px; font-size: 11px; }
  .hero__actions .text-link { font-size: 11px; gap: 8px; }
  .brand-board__mark { padding-inline: 49px; }
  .brand-board__index a { grid-template-columns: 15px 1fr 13px; gap: 6px; padding-inline: 10px; font-size: 9px; }
  .brand-board__index svg { width: 13px; }
  .service-category h3 { font-size: 22px; }
  .directory-links { grid-template-columns: 1fr; }
  .directory-links a { font-size: 12px; min-height: 55px; }
  .business-copy h2 { font-size: 37px; }
  .connection { gap: 14px; padding: 16px; }
  .connection:not(:last-child)::after { left: 39px; }
  .connection strong { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

&lt;script&gt;// Enhance native disclosures without making navigation dependent on JavaScript.
const header = document.querySelector('[data-site-header]');
const mobileMenu = header.querySelector('[data-mobile-menu]');
const disclosures = [...header.querySelectorAll('[data-service-disclosure]')];
const desktopQuery = window.matchMedia('(min-width: 1200px)');

function closeDisclosure(details, restoreFocus = false) {
  details.open = false;
  if (restoreFocus) details.querySelector('summary').focus();
}

function closeAll() {
  disclosures.forEach(details =&gt; closeDisclosure(details));
  mobileMenu.open = false;
}

// Handle the activation synchronously; queued toggle events can race when
// someone opens the next category quickly.
disclosures.forEach(details =&gt; {
  details.querySelector('summary').addEventListener('click', () =&gt; {
    if (!details.open) disclosures.forEach(other =&gt; {
      if (other !== details) closeDisclosure(other);
    });
  });
});

mobileMenu.addEventListener('toggle', () =&gt; {
  if (!mobileMenu.open) disclosures.forEach(details =&gt; closeDisclosure(details));
});

document.addEventListener('click', event =&gt; {
  if (!header.contains(event.target)) closeAll();
});

header.addEventListener('keydown', event =&gt; {
  if (event.key !== 'Escape') return;
  const current = event.target.closest('[data-service-disclosure][open]')
    || disclosures.find(details =&gt; details.open);
  if (current) {
    event.preventDefault();
    closeDisclosure(current, true);
  } else if (mobileMenu.open) {
    event.preventDefault();
    closeDisclosure(mobileMenu, true);
  }
});

header.addEventListener('focusout', () =&gt; {
  queueMicrotask(() =&gt; {
    if (!header.contains(document.activeElement)) closeAll();
  });
});

header.querySelectorAll('a').forEach(link =&gt; link.addEventListener('click', closeAll));
desktopQuery.addEventListener('change', closeAll);
&lt;/script&gt;
&lt;script&gt;// Category links open their destination before the browser scrolls to it.
// Native disclosures remain fully usable without JavaScript.
const categories = [...document.querySelectorAll('.service-category')];

function openCategory(hash) {
  const category = categories.find(item =&gt; `#${item.id}` === hash);
  if (!category) return null;
  categories.forEach(item =&gt; { item.open = item === category; });
  return category;
}

document.querySelectorAll('a[href^=&quot;#&quot;]').forEach(link =&gt; {
  link.addEventListener('click', () =&gt; {
    const category = openCategory(link.getAttribute('href'));
    if (category) {
      // Keep the next keyboard action in the newly opened category.
      category.querySelector('summary').focus({ preventScroll: true });
    }
  });
});

function syncHash() {
  const category = openCategory(window.location.hash);
  if (category) requestAnimationFrame(() =&gt; category.scrollIntoView({ block: 'start' }));
}
window.addEventListener('hashchange', syncHash);
syncHash();
