:root{--color-ink:#172536;--color-muted:#536274;--color-accent:#155dc7;--color-accent-hover:#104ba2;--color-accent-soft:#eaf2ff;--color-paper:#f5f7fb;--color-white:#fff;--color-line:#dce3ec;--font-body:Manrope,Arial,sans-serif;--max-width:1240px;--gutter:clamp(20px,3.8vw,56px)}
*{box-sizing:border-box}
html{color:var(--color-ink);background:var(--color-paper);font-family:var(--font-body);-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button,a,summary{-webkit-tap-highlight-color:transparent}
svg{display:block;flex-shrink:0}
img{display:block;max-width:100%;height:auto}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--color-accent);outline-offset:4px}
::selection{background:#cfe2ff;color:#172536}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:10px;left:16px;z-index:100;background:white;padding:12px 18px;transform:translateY(-160%)}
.skip-link:focus{transform:translateY(0)}
.page-main:focus{outline:none}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{letter-spacing:-.035em;line-height:1.3}
p{line-height:1.7}
.eyebrow{font-size:14px;font-weight:800;color:var(--color-accent);margin-bottom:12px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-height:48px;padding:12px 20px;border:1px solid transparent;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;transition:background .16s,border-color .16s,box-shadow .16s}
.button svg{width:18px;height:18px}
.button--primary,.button--dark{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.button--primary:hover,.button--dark:hover{background:var(--color-accent-hover);border-color:var(--color-accent-hover)}
.button--secondary{background:#fff;color:var(--color-ink);border-color:#bdc9d9}
.button--secondary:hover{background:var(--color-accent-soft);border-color:var(--color-accent)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
&lt;/style&gt;
  &lt;style&gt;.site-header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--color-line)}
.header-container{display:flex;align-items:center;gap:34px;width:100%;max-width:calc(var(--max-width) + var(--gutter)*2);min-height:82px;padding-inline:var(--gutter);margin:auto}
.brand{display:block;width:202px;flex-shrink:0}
.brand img{width:100%}
.desktop-nav{display:flex;align-items:center;gap:30px;margin-left:auto}
.desktop-nav&gt;a,.desktop-nav summary{display:flex;align-items:center;gap:7px;min-height:46px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.header-phone{display:flex;align-items:center;justify-content:center;min-height:45px;border:1px solid #b5c8e5;border-radius:7px;padding:10px 15px;color:var(--color-accent);font-size:15px;font-weight:800;text-decoration:none;white-space:nowrap}
.header-phone:hover{background:var(--color-accent-soft)}
.phone-short{display:none}
.desktop-nav&gt;a:hover,.desktop-nav summary:hover{color:var(--color-accent)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.service-disclosure{position:relative}
.service-disclosure&gt;summary&gt;svg{width:15px;height:15px;transition:transform .16s}
.service-disclosure[open]&gt;summary&gt;svg{transform:rotate(180deg)}
.service-menu{position:absolute;top:calc(100% + 15px);left:-20px;width:330px;padding:10px;background:#fff;border:1px solid var(--color-line);border-radius:12px;box-shadow:0 12px 36px #17253620}
.service-menu a{display:flex;align-items:center;gap:13px;padding:12px;min-height:54px;border-radius:7px;font-size:14px;font-weight:600;text-decoration:none}

      &lt;div class=&quot;faq-list&quot;&gt;&lt;details name=&quot;questions&quot;&gt;&lt;summary&gt;How much will it cost?&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14M12 5v14&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;p&gt;Pricing depends on the project or device and the work involved. Share a few details, and we can discuss the scope and a quote before getting started.&lt;/p&gt;&lt;/details&gt;
&lt;details name=&quot;questions&quot;&gt;&lt;summary&gt;Can you repair my phone or computer?&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14M12 5v14&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;p&gt;Repair options depend on the model, the problem, and the parts needed. Include the device model and a description of what is happening so we can work out the next step.&lt;/p&gt;&lt;/details&gt;
&lt;details name=&quot;questions&quot;&gt;&lt;summary&gt;Where do you offer help?&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14M12 5v14&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;p&gt;I serve all of Fremont County, Wyoming. Remote help, visits to your home or business, and arranged device drop-off are available. Call first to discuss what you need and arrange the right approach.&lt;/p&gt;&lt;/details&gt;
&lt;details name=&quot;questions&quot;&gt;&lt;summary&gt;Can I drop off a device?&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14M12 5v14&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;p&gt;Yes, by arrangement. There isn’t a public storefront at this time. Call before bringing a device so we can agree on the handoff and discuss the issue.&lt;/p&gt;&lt;/details&gt;
&lt;details name=&quot;questions&quot;&gt;&lt;summary&gt;What if I need something that isn’t listed?&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 12h14M12 5v14&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;p&gt;Ask. If it involves a website, technology, photography, or video, tell me what you have in mind. I’ll be clear about whether it’s something I can take on.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;
    &lt;/div&gt;

&lt;script&gt;// Enhance native disclosures without making navigation dependent on JavaScript.
const header = document.querySelector('[data-site-header]');
const mobileMenu = header.querySelector('[data-mobile-menu]');
const disclosures = [...header.querySelectorAll('[data-service-disclosure]')];
const desktopQuery = window.matchMedia('(min-width: 900px)');

function closeDisclosure(details, restoreFocus = false) {
  details.open = false;
  if (restoreFocus) details.querySelector('summary').focus();
}

function closeAll() {
  disclosures.forEach(details =&gt; closeDisclosure(details));
  mobileMenu.open = false;
}

// Handle the activation synchronously; queued toggle events can race when
// someone opens the next category quickly.
disclosures.forEach(details =&gt; {
  details.querySelector('summary').addEventListener('click', () =&gt; {
    if (!details.open) disclosures.forEach(other =&gt; {
      if (other !== details) closeDisclosure(other);
    });
  });
});

mobileMenu.addEventListener('toggle', () =&gt; {
  if (!mobileMenu.open) disclosures.forEach(details =&gt; closeDisclosure(details));
});

document.addEventListener('click', event =&gt; {
  if (!header.contains(event.target)) closeAll();
});

header.addEventListener('keydown', event =&gt; {
  if (event.key !== 'Escape') return;
  const current = event.target.closest('[data-service-disclosure][open]')
    || disclosures.find(details =&gt; details.open);
  if (current) {
    event.preventDefault();
    closeDisclosure(current, true);
  } else if (mobileMenu.open) {
    event.preventDefault();
    closeDisclosure(mobileMenu, true);
  }
});

header.addEventListener('focusout', () =&gt; {

&lt;script&gt;// Dependency-free helpers shared by the browser and server-side verification.
(() =&gt; {
  function validateInquiry(data, allowedCategories) {
    const errors = {};
    const clean = {};
    const limits = { name: 100, category: 40, service: 80, method: 10, contact: 160, context: 240, location: 100, message: 4000, timing: 160, company_url: 240 };
    for (const [key, max] of Object.entries(limits)) {
      const value = data?.[key];
      clean[key] = typeof value === 'string' ? value.trim() : '';
      if (typeof value !== 'string' &amp;&amp; value !== undefined || clean[key].length &gt; max) errors[key] = 'Please shorten or correct this field.';
    }
    if (!clean.name) errors.name = 'Enter your name.';
    if (!allowedCategories.includes(clean.category)) errors.category = 'Choose a service category.';
    if (!['phone', 'email'].includes(clean.method)) errors.method = 'Choose how you’d like a reply.';
    if (clean.method === 'email' &amp;&amp; !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean.contact)) errors.contact = 'Enter a valid email address.';
    if (clean.method === 'phone' &amp;&amp; (!/^[+\d() .-]+$/.test(clean.contact) || clean.contact.replace(/\D/g, '').length &lt; 10 || clean.contact.replace(/\D/g, '').length &gt; 15)) errors.contact = 'Enter a phone number with area code.';
    if (clean.message.length &lt; 10) errors.message = 'Add a few details about what you need (at least 10 characters).';
    return { data: clean, errors, valid: Object.keys(errors).length === 0 };
  }
  async function sendInquiry(endpoint, data, requestId, transport = fetch) {
    const response = await transport(endpoint, {
      method: 'POST', credentials: 'omit',
      headers: { 'Content-Type': 'application/json', 'Idempotency-Key': requestId },
      body: JSON.stringify(data), signal: AbortSignal.timeout(20000),
    });
    const result = await response.json().catch(() =&gt; ({}));
    if (!response.ok || result.accepted !== true) {
      const error = new Error(response.status === 429 ? 'Please wait a minute before trying again, or call directly.' : 'Your request could not be confirmed. Your details are still here. Please try again, call, or email.');
      error.fields = result.fields || {};
      throw error;
    }
    return result;
  }
  globalThis.FremontInquiryTools = Object.freeze({ validateInquiry, sendInquiry });
})();

&lt;script&gt;// Progressive category browsing and an inquiry form with explicit delivery states.
(() =&gt; {
  const tabs = [...document.querySelectorAll('[data-category-tab]')];
  const panels = [...document.querySelectorAll('[data-service-panel]')];
  const tablist = document.querySelector('[data-category-tabs]');
  tablist.setAttribute('role', 'tablist');
  tabs.forEach(tab =&gt; { tab.setAttribute('role', 'tab'); tab.setAttribute('aria-controls', tab.dataset.categoryTab); });
  panels.forEach(panel =&gt; { panel.setAttribute('role', 'tabpanel'); panel.setAttribute('aria-labelledby', `tab-${panel.id}`); panel.tabIndex = 0; });
  function activate(id) {
    if (!panels.some(panel =&gt; panel.id === id)) return;
    panels.forEach(panel =&gt; { panel.hidden = panel.id !== id; });
    tabs.forEach(tab =&gt; { const selected = tab.dataset.categoryTab === id; tab.setAttribute('aria-selected', String(selected)); tab.tabIndex = selected ? 0 : -1; });
  }
  tabs.forEach((tab, index) =&gt; {
    tab.addEventListener('click', event =&gt; { event.preventDefault(); activate(tab.dataset.categoryTab); });
    tab.addEventListener('keydown', event =&gt; {
      if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); activate(tab.dataset.categoryTab); return; }
      let next;
      if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
      if (event.key === 'ArrowLeft') next = (index - 1 + tabs.length) % tabs.length;
      if (event.key === 'Home') next = 0;
      if (event.key === 'End') next = tabs.length - 1;
      if (next === undefined) return;
      event.preventDefault(); activate(tabs[next].dataset.categoryTab); tabs[next].focus();
    });
  });
  document.querySelectorAll('[data-category-link]').forEach(link =&gt; link.addEventListener('click', () =&gt; {
    activate(link.dataset.categoryLink);
    document.getElementById(`${link.dataset.categoryLink}-heading`)?.focus({ preventScroll: true });
  }));
  function syncHash() { activate(window.location.hash.slice(1)); }
  activate(panels[0].id); syncHash();
  window.addEventListener('hashchange', syncHash);

  const { validateInquiry, sendInquiry } = globalThis.FremontInquiryTools;
  const form = document.querySelector('[data-inquiry-form]');
  const fields = form.elements;
  const category = fields.namedItem('category');
  const contact = fields.namedItem('contact');
  const status = form.querySelector('[data-form-status]');
  const button = form.querySelector('[data-submit]');
  const review = form.querySelector('[data-request-review]');
  const chosen = form.querySelector('[data-chosen-service]');
  const drafts = new Map();
  let currentCategory = category.value;
  let pending = false;
  let submissionKey;
  let lastPayload;
  function updatePrompts() {
    const selected = category.selectedOptions[0].dataset;
    form.querySelector('[data-context-label]').textContent = `${selected.contextLabel} (optional)`;
    fields.namedItem('context').placeholder = selected.contextPlaceholder;
    form.querySelector('[data-message-hint]').textContent = selected.messagePrompt;
    form.querySelector('[data-timing-label]').textContent = `${selected.timingLabel} (optional)`;
  }
  function chooseCategory(id, service = '', name = '') {
    if (![...category.options].some(option =&gt; option.value === id)) return;
    drafts.set(currentCategory, { context: fields.namedItem('context').value, message: fields.namedItem('message').value, timing: fields.namedItem('timing').value });
    category.value = id;
    if (currentCategory !== id) {
      const draft = drafts.get(id) || {};
      for (const key of ['context', 'message', 'timing']) fields.namedItem(key).value = draft[key] || '';
    }
    currentCategory = id;
    fields.namedItem('service').value = service;
    chosen.textContent = name ? `About: ${name}` : '';
    chosen.hidden = !name;
    updatePrompts(); clearErrors(); review.hidden = true;
  }
  category.addEventListener('change', () =&gt; chooseCategory(category.value));
  document.querySelectorAll('[data-request-category]').forEach(link =&gt; link.addEventListener('click', event =&gt; {
    event.preventDefault();
    if (pending) return;
    chooseCategory(link.dataset.requestCategory, link.dataset.requestService, link.dataset.requestName);
    document.querySelector('#contact').scrollIntoView({ block: 'start' });
    fields.namedItem('name').focus({ preventScroll: true });
  }));
  function updateMethod() {
    const email = fields.namedItem('method').value === 'email';
    form.querySelector('[data-contact-label]').textContent = email ? 'Email address *' : 'Phone number *';
    contact.type = email ? 'email' : 'tel';
    contact.autocomplete = email ? 'email' : 'tel';
    contact.placeholder = email ? 'you@example.com' : '(307) 555-0123';
    contact.value = '';
  }
  fields.namedItem('method').addEventListener('change', updateMethod);
  function clearErrors() {
    form.querySelectorAll('[data-field-error]').forEach(node =&gt; node.remove());
    [...fields].forEach(field =&gt; { field.removeAttribute('aria-invalid'); field.removeAttribute('aria-errormessage'); });
    status.textContent = '';
  }
  function showErrors(errors) {
    for (const [name, message] of Object.entries(errors)) {
      const field = fields.namedItem(name);
      if (!field || field.type === 'hidden') continue;
      const error = document.createElement('p');
      error.id = `error-${name}`; error.className = 'field-error'; error.dataset.fieldError = ''; error.textContent = message;
      field.insertAdjacentElement('afterend', error);
      field.setAttribute('aria-invalid', 'true'); field.setAttribute('aria-errormessage', error.id);
    }
    const first = form.querySelector('[aria-invalid=&quot;true&quot;]');
    if (first) first.focus();
  }
  form.addEventListener('input', () =&gt; { review.hidden = true; });
  form.addEventListener('submit', async event =&gt; {
    event.preventDefault(); if (pending) return;
    clearErrors(); review.hidden = true;
    const result = validateInquiry(Object.fromEntries(new FormData(form)), [...category.options].map(option =&gt; option.value));
    if (!result.valid) { showErrors(result.errors); status.textContent = 'Please check the highlighted fields.'; return; }
    if (!form.dataset.endpoint) {
      const list = form.querySelector('[data-review-details]'); list.replaceChildren();
      const entries = { Name: result.data.name, Service: chosen.hidden ? category.selectedOptions[0].textContent : chosen.textContent.replace('About: ', ''), 'Reply by': `${result.data.method}: ${result.data.contact}`, Context: result.data.context, Area: result.data.location, Request: result.data.message, Timing: result.data.timing };
      for (const [label, value] of Object.entries(entries)) {
        if (!value) continue;
        const term = document.createElement('dt'); term.textContent = label;
        const description = document.createElement('dd'); description.textContent = value;
        list.append(term, description);
      }
      review.hidden = false; status.textContent = 'Request preview ready. Nothing has been sent.'; status.focus(); return;
    }
    pending = true; [...fields].forEach(field =&gt; { field.disabled = true; }); form.setAttribute('aria-busy', 'true'); button.textContent = 'Sending…';
    const serialized = JSON.stringify(result.data);
    if (serialized !== lastPayload) { submissionKey = crypto.randomUUID(); lastPayload = serialized; }
    try {
      await sendInquiry(form.dataset.endpoint, result.data, submissionKey);
      status.textContent = 'Your request has been sent. I’ll use your preferred contact method to follow up.';
      form.reset(); drafts.clear(); currentCategory = category.value; chosen.hidden = true; chosen.textContent = ''; updatePrompts(); updateMethod();
    } catch (error) {
      showErrors(error.fields || {});
      status.textContent = error.message === 'The operation was aborted due to timeout' || error.name === 'TimeoutError' || error instanceof TypeError ? 'We couldn’t confirm your request. Your details are still here. Please retry, call, or email.' : error.message;
    } finally {
      pending = false; [...fields].forEach(field =&gt; { field.disabled = false; }); button.textContent = 'Send request'; form.removeAttribute('aria-busy'); status.focus();
    }
  });
  form.noValidate = true; updatePrompts(); form.hidden = false;
})();
